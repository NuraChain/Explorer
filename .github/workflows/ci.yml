# The same gates you run locally, on every push: check, build, test, coverage.
#
# Split into jobs so a failure names itself in the run list rather than being one red step in a
# long one - a lint error and a failing integration test are different problems and are triaged by
# different people.
#
# Nothing here needs a secret or a network: the server suite runs against a PostgreSQL the job
# starts for itself and a stubbed chain, so a fork's pull request gets exactly the same result as a
# push to main. The database is a throwaway service container that trusts its local connections -
# there is no password in this file because there is no password to keep.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx azeroth build

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nura_explorer_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        # Over TCP: while the image initialises, its temporary server listens on the socket only,
        # and a socket check would call it healthy before the suite can reach it.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d nura_explorer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/nura_explorer_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit, integration, API, data-layer, security, property and RPC-client suites - the whole
      # server surface, with coverage so a drop is visible in the log rather than discovered later.
      - run: npm run test:coverage --workspace server
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: server/coverage
          if-no-files-found: ignore

  test-application:
    name: Application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test --workspace application

  test-shuffled:
    name: Tests in random order
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nura_explorer_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d nura_explorer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/nura_explorer_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The isolation gate. Every suite here shares module-level singletons - the stores in the
      # browser half, the signature table in the server half - and a test that only passes in
      # declaration order is a test that will fail for somebody else at random. Running shuffled
      # on every push is what keeps that from being discovered on an unrelated pull request.
      - run: npm run test:shuffle --workspace server
      - run: npm run test:shuffle --workspace application
