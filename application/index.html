<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <!-- The pre-hydration values. Each page sets its own title once it knows what it is
             showing; this is what a crawler, a social preview and a reader without JS get, so
             it names the product rather than the chain (which is configuration). The script
             below swaps it for the Persian name when that is the language being restored. -->
        <title>Nura Explorer</title>
        <meta name="description" content="An open block explorer for EVM chains. Every block, transaction and transfer is indexed locally, so you can follow where value actually moved."/>
        <!-- The browser chrome around the page, matching --void in styles/tokens.css for each
             theme (the manifest carries the dark one too). A value that disagreed with the page
             behind it would draw a visible seam on every load. -->
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F8FA"/>
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080B12"/>
        <!-- Three consumers, three formats: the .ico holds 16/32/48 for tabs, iOS reads only
             apple-touch-icon (it ignores .ico entirely), and Android takes the 192/512 pair
             through the manifest. All four are cut from brand/icon-source.png. -->
        <link rel="icon" href="/favicon.ico" sizes="any"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <link rel="manifest" href="/site.webmanifest"/>
        <link rel="stylesheet" href="/src/styles.css"/>
        <!-- No locale script here, and there must not be one. The SERVER negotiates the reader's
             language per request and rewrites the `lang` and `dir` below before the first byte
             leaves, so the first paint is already correct and already labelled - for a crawler
             and for a reader with no JavaScript as much as for anyone else. What stood here was
             a copy of locale.store.ts's language list, its RTL set and nine translated titles,
             kept in sync by hand, that could only run after the bundle had. -->
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.azeroth" defer></script>
    </body>
</html>
