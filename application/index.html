<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <!-- The pre-hydration values. Each page sets its own title once it knows what it is
             showing; this is what a crawler, a social preview and a reader without JS get, so
             it names the product rather than the chain (which is configuration). The script
             below swaps it for the Persian name when that is the language being restored. -->
        <title>Nura Explorer</title>
        <meta name="description" content="An open block explorer for EVM chains. Every block, transaction and transfer is indexed locally, so you can follow where value actually moved."/>
        <!-- The browser chrome around the page, matching --void in styles/tokens.css for each
             theme (the manifest carries the dark one too). A value that disagreed with the page
             behind it would draw a visible seam on every load. -->
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F8FA"/>
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080B12"/>
        <!-- Three consumers, three formats: the .ico holds 16/32/48 for tabs, iOS reads only
             apple-touch-icon (it ignores .ico entirely), and Android takes the 192/512 pair
             through the manifest. All four are cut from brand/icon-source.png. -->
        <link rel="icon" href="/favicon.ico" sizes="any"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <link rel="manifest" href="/site.webmanifest"/>
        <link rel="stylesheet" href="/src/styles.css"/>
        <!-- Applies the stored language BEFORE first paint. The locale store would do it too, but
             only once the bundle has run, and a page that renders left-to-right and then flips is
             worse than one that starts correct. The three lists are kept in sync with
             locale.store.ts (LOCALES, LOCALE_DIR) and each locale's `brand.name` by hand -
             importing the modules here would defeat the point. -->
        <script>
            try
            {
                var locales = ['en', 'fa', 'ar', 'es', 'pt', 'hi', 'zh', 'ru', 'fr', 'tr'];
                var rtl = ['fa', 'ar'];
                // The bundle renames the tab on its first render; this is the only title a
                // reader without JS ever sees. English keeps the title in the markup above.
                var titles = {
                    fa: 'کاوشگر نورا',
                    ar: 'مستكشف نورا',
                    es: 'Explorador Nura',
                    pt: 'Explorador Nura',
                    hi: 'नूरा एक्सप्लोरर',
                    zh: 'Nura 区块浏览器',
                    ru: 'Обозреватель Nura',
                    fr: 'Explorateur Nura',
                    tr: 'Nura Gezgini'
                };
                var saved = localStorage.getItem('nura.locale');
                var lang = locales.indexOf(saved) === -1 ? '' : saved;
                if (lang === '')
                {
                    // First match in PREFERENCE ORDER, matching initial() in locale.store.ts.
                    lang = 'en';
                    var wanted = navigator.languages || [];
                    for (var i = 0; i < wanted.length; i++)
                    {
                        var subtag = wanted[i].toLowerCase().split('-')[0];
                        if (locales.indexOf(subtag) !== -1)
                        {
                            lang = subtag;
                            break;
                        }
                    }
                }
                document.documentElement.lang = lang;
                document.documentElement.dir = rtl.indexOf(lang) === -1 ? 'ltr' : 'rtl';
                if (titles[lang] !== undefined)
                {
                    document.title = titles[lang];
                }
            }
            catch (error)
            {
                // A blocked localStorage leaves the document's own lang and dir in place.
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.azeroth" defer></script>
    </body>
</html>
